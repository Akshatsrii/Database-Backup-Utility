version: "3.9"

services:

  # ── Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: backupos-backend-prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT:                    4000
      NODE_ENV:                production
      ENCRYPTION_KEY:          ${ENCRYPTION_KEY}
      BACKUP_RETENTION_DAYS:   ${BACKUP_RETENTION_DAYS:-30}
      FIREBASE_PROJECT_ID:     ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY:    ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL:   ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      SLACK_WEBHOOK_URL:       ${SLACK_WEBHOOK_URL:-}
    volumes:
      - backup_files:/app/backups
      - backup_logs:/app/logs
      - backup_data:/app/data
    networks:
      - backupos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus:   "1.0"
          memory: 512M
        reservations:
          memory: 256M

  # ── Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL}
    container_name: backupos-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - backupos-network
    deploy:
      resources:
        limits:
          cpus:   "0.5"
          memory: 256M

  # ── Nginx Reverse Proxy ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: backupos-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - backupos-network

# ── Volumes ───────────────────────────────────────────────────
volumes:
  backup_files:
  backup_logs:
  backup_data:

# ── Network ───────────────────────────────────────────────────
networks:
  backupos-network:
    driver: bridge